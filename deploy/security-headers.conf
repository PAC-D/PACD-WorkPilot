add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://cognito-idp.eu-north-1.amazonaws.com https://s3.eu-north-1.amazonaws.com https://*.s3.eu-north-1.amazonaws.com; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
