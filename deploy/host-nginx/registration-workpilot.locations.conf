# Add these locations inside the existing registration.pac-d.com HTTPS server.
# The upstream binds only to loopback, so it cannot be reached from the internet directly.
location = /workpilot {
    return 301 /workpilot/;
}

location = /workpilot/api/v1/events {
    limit_req zone=workpilot_api burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080/api/v1/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /workpilot;
    proxy_buffering off;
    proxy_read_timeout 1h;
}

location /workpilot/api/ {
    limit_req zone=workpilot_api burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;

    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /workpilot;
    proxy_redirect off;
}

location /workpilot/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /workpilot;
    proxy_redirect off;
}
